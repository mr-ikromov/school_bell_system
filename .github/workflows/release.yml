name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qurish:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            nom: 'Linux (x86_64)'
            target: ''
          - os: windows-latest
            nom: 'Windows (x86_64)'
            target: ''
          - os: macos-latest
            nom: 'macOS (Universal)'
            target: 'universal-apple-darwin'

    steps:
      - uses: actions/checkout@v7
      - name: Tizim kutubxonalari (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev \
            patchelf file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest'
                       && 'aarch64-apple-darwin,x86_64-apple-darwin'
                       || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-${{ matrix.target }}
      - name: tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4
      - name: Qurish
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Artefaktlar
        uses: actions/upload-artifact@v7
        with:
          name: bell-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
  reliz:
    name: Relizni chiqarish
    needs: qurish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist }
      - name: Fayllar ro'yxati
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            | Tizim | Fayl |
            |---|---|
            | Windows | `.msi` yoki `.exe` |
            | macOS (Intel va Apple Silicon) | `.dmg` — universal |
            | Debian / Ubuntu | `.deb` |
            | Fedora / openSUSE | `.rpm` |
            | Boshqa Linux | `.AppImage` |
            Paketlar imzolanmagan. macOS'da birinchi ochishda
            **O'ng tugma → Open**, Windows'da SmartScreen ogohlantirishida
            **More info → Run anyway** tanlanadi.
            Kompyuterning boshqa ovozlari kuchaytirgichga bormasligi
            **Linux'da** (PipeWire / PulseAudio) sinovdan o'tgan.
            Windows'da kod bor, lekin haqiqiy uskunada tekshirilmagan.
            macOS'da bu imkoniyat hali bajarilmagan — u yerda ilova
            signalni tizimning standart chiqishiga yuboradi.
