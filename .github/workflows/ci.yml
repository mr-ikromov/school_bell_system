name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tekshiruv:
    name: Format va Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Tizim kutubxonalari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  platformalar:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nom: 'Windows kodi' }
          - { os: macos-latest,   nom: 'macOS kodi (Apple Silicon)' }
          - { os: macos-13,       nom: 'macOS kodi (Intel)' }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: Frontend tekshiruvi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: JS sintaksisi
        run: for f in src/js/*.js; do node --check "$f"; done
      - name: O'lik kod va i18n
        run: python3 .github/scripts/audit.py
